name: CI

on:
  push:
    branches: [main, "*-SNAPSHOT"]
  pull_request:
    branches: [main, "*-SNAPSHOT"]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy typecheck
        run: uv run mypy src

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }} --extra dev

      - name: Run pytest with coverage
        run: uv run pytest -v --cov=researchability --cov-report=term-missing

  build-wheel-smoke-test:
    name: Package Build & Wheel Smoke Test
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Build sdist and wheel
        run: uv build

      - name: Smoke-test wheel in isolated environment
        run: |
          uv venv /tmp/smoke-venv --python 3.12
          uv pip install --python /tmp/smoke-venv/bin/python dist/*.whl
          cd /tmp && /tmp/smoke-venv/bin/researchability gates --profile ml_cs
